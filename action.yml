name: "Connect to Headscale"
description: "Connects to a Headscale server using the Tailscale CLI"

branding:
  icon: 'server'
  color: 'red'

inputs:
  login-server:
    description: "Headscale Login Server"
    required: true
  auth-key:
    description: "Headscale Auth Key"
    required: true

runs:
  using: "composite"
  steps:    
    - id: install-tailscale-cli
      shell: bash
      run: |
        echo "Installing Tailscale cli"
        curl -fsSL https://tailscale.com/install.sh | sh

    - id: connect-tailscale
      uses: gacts/run-and-post-run@v1.4.4
      with:
        run: |
          echo "Connecting to Tailscale..."
          sudo tailscale up \
            --accept-dns \
            --accept-routes \
            --authkey=${{ inputs.auth-key }} \
            --login-server=${{ inputs.login-server }} \
            --operator=${USER} \
            --timeout=90s 
          echo "Tailscale status:"
          tailscale status
        post: |
          tailscale down || true
          echo "Tailscale is down!"
